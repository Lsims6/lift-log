name: Build Lift Log

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_test:
        description: "Skip the simulator test (faster; the build still goes to TestFlight)"
        type: boolean
        default: false

permissions:
  contents: write   # lets the last step save logs and screenshots to the ci-results branch

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26   # Xcode 26: Apple requires the iOS 26 SDK for TestFlight uploads
    timeout-minutes: 45
    env:
      # Skip the simulator test for small changes: put [skip test] in the commit message,
      # or tick "Skip the simulator test" when running the workflow by hand.
      SKIP_TEST: ${{ contains(github.event.head_commit.message, '[skip test]') || inputs.skip_test == true }}
      # Apple Developer account (see README). With these set, every passing build goes to TestFlight.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Tells the app how new the page inside it is, so a live update never swaps it for an older one.
      - name: Stamp the page version
        run: python3 scripts/web-version.py LiftLog/Web

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        if: env.SKIP_TEST != 'true'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devs = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devs.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for d in items:
                  if not d["name"].startswith("iPhone"):
                      continue
                  plain = 1 if re.fullmatch(r"iPhone \d+", d["name"]) else 0
                  key = (ver, plain)
                  if best is None or key > best[0]:
                      best = (key, d["udid"], d["name"], runtime)
          print(best[1])
          print(best[2], best[3], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Start booting the virtual iPhone now; it warms up while the app is built and uploaded.
      - name: Start booting the simulator
        if: env.SKIP_TEST != 'true'
        run: xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true

      # ---- TestFlight first ----
      # The build goes to TestFlight before the simulator test, so it's there about 4 minutes in. The test
      # still runs right after and the run shows as failed if it doesn't pass. Every change is also
      # tried in a browser before it's pushed.
      # Signs the app with the Apple Developer account through the App Store Connect API key
      # (Xcode creates and renews the certificates itself). Runs only when the four secrets are set.
      - name: Check Apple secrets
        id: asc
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping TestFlight; these repository secrets are missing or empty:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive signed app
        if: success() && steps.asc.outputs.ready == 'true'
        run: |
          mkdir -p build ~/private_keys
          KEY=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # tolerate a key pasted with Windows line endings or stray spaces
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"
          # every upload needs a higher build number than the last; the run number always goes up
          BUILD_NO=$(( ${{ github.run_number }} + 100 ))
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          set +e
          xcodebuild archive \
            -project LiftLog.xcodeproj -scheme LiftLog \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/LiftLog.xcarchive \
            -derivedDataPath build/archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NO" > build/archive.log 2>&1
          status=$?
          set -e
          grep -E "error:|\*\* ARCHIVE" build/archive.log | tail -n 30 || true
          if [ $status -ne 0 ]; then
            grep -E "error:" build/archive.log | head -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $status

      - name: Upload to TestFlight
        if: success() && steps.asc.outputs.ready == 'true'
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set +e
          xcodebuild -exportArchive \
            -archivePath build/LiftLog.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > build/upload.log 2>&1
          status=$?
          set -e
          grep -E "error|Upload succeeded|EXPORT SUCCEEDED|EXPORT FAILED|Progress" build/upload.log | tail -n 30 || true
          if [ $status -ne 0 ]; then
            grep -iE "error" build/upload.log | head -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
            exit $status
          fi
          echo "Build $BUILD_NO uploaded to TestFlight. Apple takes about 5–15 minutes to process it." | tee -a "$GITHUB_STEP_SUMMARY"

      # ---- Simulator test (after the upload) ----
      - name: Wait for the simulator
        if: "!cancelled() && env.SKIP_TEST != 'true'"
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Run the app test on the simulator
        if: "!cancelled() && env.SKIP_TEST != 'true'"
        run: |
          mkdir -p build
          run_test() {
            rm -rf build/TestResults.xcresult
            xcodebuild test \
              -project LiftLog.xcodeproj -scheme LiftLog \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath build/sim \
              -resultBundlePath build/TestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO > build/test.log 2>&1
          }
          set +e
          run_test
          status=$?
          # A launch timeout is the runner being slow, not the app failing: try once more.
          if [ $status -ne 0 ] && grep -qE "Failed to launch|Timed out while launching" build/test.log; then
            echo "Simulator was slow to launch the app; retrying the test once."
            cp build/test.log build/test-attempt1.log
            run_test
            status=$?
          fi
          set -e
          grep -E "error:|warning: .*LiftLog|Test Case|\*\* TEST|XCTAssert" build/test.log | tail -n 80 || true
          if [ $status -ne 0 ]; then
            grep -E "error:|failed|XCTAssert" build/test.log | head -n 15 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $status

      - name: Collect screenshots
        if: "!cancelled() && env.SKIP_TEST != 'true'"
        run: |
          mkdir -p screenshots
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path screenshots || true
            # Keep only the named PNG screenshots, renamed to their step names (1-monday.png, ...).
            python3 - <<'PY' || true
          import json, os
          d = "screenshots"
          man = os.path.join(d, "manifest.json")
          if os.path.exists(man):
              for test in json.load(open(man)):
                  for a in test.get("attachments", []):
                      src = os.path.join(d, a.get("exportedFileName", ""))
                      name = a.get("suggestedHumanReadableName", "")
                      if not os.path.isfile(src):
                          continue
                      if name[:1].isdigit():
                          os.replace(src, os.path.join(d, name.split("_")[0] + ".png"))
                      else:
                          os.remove(src)
          PY
          fi
          # One more look in dark mode, with the data the test left behind.
          APP=build/sim/Build/Products/Debug-iphonesimulator/LiftLog.app
          UDID=${{ steps.sim.outputs.udid }}
          if [ -d "$APP" ]; then
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl ui "$UDID" appearance dark || true
            xcrun simctl install "$UDID" "$APP" || true
            xcrun simctl launch "$UDID" com.lsims6.liftlog || true
            sleep 8
            xcrun simctl io "$UDID" screenshot screenshots/7-dark-mode.png || true
          fi
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          retention-days: 7

      # Also keep the latest results (logs and screenshots) on a
      # separate ci-results branch, so they can be read with plain git. main is never touched.
      - name: Save results to the ci-results branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUT=$(mktemp -d)
          cp -R screenshots "$OUT/" 2>/dev/null
          for f in build/*.log; do [ -f "$f" ] && tail -n 4000 "$f" > "$OUT/$(basename "$f")"; done
          printf 'run: %s\ncommit: %s\nresult: %s\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ job.status }}" > "$OUT/RESULT.txt"
          cd "$OUT"
          git init -q -b ci-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Results for build ${{ github.run_number }} (${{ job.status }})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-results
          echo "Saved results to the ci-results branch"
