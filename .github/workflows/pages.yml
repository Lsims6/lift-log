name: Publish test site

# Publishes the app's screen (LiftLog/Web) to GitHub Pages so it can be tried in any browser.
# On the website, the log saves in that browser instead of on the phone.
on:
  push:
    branches: [main]
    paths:
      - "LiftLog/Web/**"
      - "scripts/web-version.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # version.json tells the iPhone app a newer page is up (live updates), with a checksum for each file
      - name: Stamp the page version
        run: python3 scripts/web-version.py LiftLog/Web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: LiftLog/Web
      - id: deployment
        uses: actions/deploy-pages@v4
