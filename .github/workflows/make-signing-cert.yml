# One-time setup: turns signing/request.csr (a public certificate request; its private key is not
# in this repo) into an Apple Distribution certificate through the App Store Connect API, and saves
# the certificate (public) to the signing-cert branch. Removed once the certificate is set up.
name: Make signing certificate

on:
  push:
    branches: [main]
    paths: [signing/request.csr]

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Ask Apple for the certificate
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip -q install pyjwt cryptography
          mkdir -p out
          /tmp/v/bin/python - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt
          key = os.environ["ASC_KEY_P8"].replace("\r", "").strip()
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": int(time.time()),
                              "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"].strip(), "typ": "JWT"})
          body = json.dumps({"data": {"type": "certificates", "attributes": {
              "certificateType": "DISTRIBUTION", "csrContent": open("signing/request.csr").read()}}}).encode()
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/certificates", data=body,
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
          try:
              res = json.load(urllib.request.urlopen(req))
              a = res["data"]["attributes"]
              open("out/certificate.cer.b64", "w").write(a["certificateContent"])
              open("out/RESULT.txt", "w").write(f"ok\nid: {res['data']['id']}\nname: {a.get('name')}\nexpires: {a.get('expirationDate')}\n")
              print("Certificate created:", a.get("name"), a.get("expirationDate"))
          except urllib.error.HTTPError as e:
              msg = e.read().decode()
              open("out/RESULT.txt", "w").write(f"error {e.code}\n{msg}\n")
              print("::error::Apple said", e.code, msg[:500])
          PY
      - name: Save the certificate to the signing-cert branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b signing-cert
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Signing certificate request result"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" signing-cert
          grep -q '^ok' RESULT.txt
